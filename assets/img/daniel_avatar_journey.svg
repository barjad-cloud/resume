<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 96" width="80" height="96" class="daniel-avatar-svg" aria-label="Daniel Barja Centeno Journey Avatar">
  <defs>
    <filter id="avatar-soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ground Shadow on Progress Bar -->
  <ellipse cx="40" cy="91" rx="16" ry="3.5" fill="rgba(15, 23, 42, 0.22)" class="avatar-ground-shadow"/>

  <!-- Legs & Shoes -->
  <g id="avatar-legs" class="avatar-legs">
    <!-- Left Leg -->
    <path d="M 33 73 L 33 87 L 27 87 C 25.5 87 25 89 27 90 L 37 90 C 38 90 38 88 37 87 L 37 73 Z" fill="#1e293b"/>
    <!-- Right Leg -->
    <path d="M 43 73 L 43 87 L 39 87 C 37.5 87 37 89 39 90 L 49 90 C 50.5 90 51 88 49 87 L 47 73 Z" fill="#0f172a"/>
  </g>

  <!-- Torso & Smart Casual Jacket -->
  <g id="avatar-torso" class="avatar-torso">
    <!-- Body Shape -->
    <path d="M 28 50 C 28 44, 52 44, 52 50 L 55 74 C 55 75.5, 25 75.5, 25 74 Z" fill="var(--ctx-accent, #2563eb)" class="avatar-blazer"/>
    <!-- Inner Shirt / V-Neck -->
    <polygon points="36,46 40,56 44,46" fill="#f8fafc"/>
    <!-- Subtle Jacket Lapels -->
    <path d="M 28 50 L 36 62 L 36 74" stroke="#1d4ed8" stroke-width="1.2" fill="none"/>
    <path d="M 52 50 L 44 62 L 44 74" stroke="#1d4ed8" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Head, Hair, Glasses & Facial Features (Fiel a Daniel Barja Centeno) -->
  <g id="avatar-head" class="avatar-head">
    <!-- Neck -->
    <rect x="37" y="41" width="6" height="8" rx="2" fill="#fcd34d"/>
    <!-- Face Contour -->
    <path d="M 29 23 C 29 13, 51 13, 51 23 C 51 35, 47 43, 40 43 C 33 43, 29 35, 29 23 Z" fill="#fde68a" stroke="#d97706" stroke-width="0.5"/>
    <!-- Ears -->
    <circle cx="28.5" cy="27" r="3" fill="#fde68a"/>
    <circle cx="51.5" cy="27" r="3" fill="#fde68a"/>
    
    <!-- Daniel's Neat Dark Hair -->
    <path d="M 28 23 C 28 10, 37 7, 44 7 C 51 7, 53 12, 53 18 C 50 15, 46 14, 41 14 C 34 14, 30 18, 28 23 Z" fill="#1e293b"/>
    <!-- Left Hair Sideburn -->
    <path d="M 28.5 22 L 28.5 28 L 30.5 25 Z" fill="#1e293b"/>
    <!-- Right Hair Sideburn -->
    <path d="M 51.5 22 L 51.5 28 L 49.5 25 Z" fill="#1e293b"/>

    <!-- Trimmed Dark Beard & Mustache -->
    <path d="M 33 34 Q 40 36 47 34 Q 48 42 40 43 Q 32 42 33 34 Z" fill="#1e293b"/>
    <path d="M 35 32 Q 40 34 45 32 Q 40 33 35 32 Z" fill="#0f172a"/>
    <!-- Warm Confident Smile -->
    <path d="M 37 36.5 Q 40 38.5 43 36.5" stroke="#ffffff" stroke-width="1.3" fill="none" stroke-linecap="round"/>

    <!-- Eyebrows -->
    <path d="M 31.5 19 Q 35 18 38 19" stroke="#1e293b" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <path d="M 42 19 Q 45 18 48.5 19" stroke="#1e293b" stroke-width="1.4" fill="none" stroke-linecap="round"/>

    <!-- Glasses: Modern Rectangular Rounded Frames -->
    <rect x="31" y="21.5" width="8" height="6.5" rx="1.8" fill="rgba(255, 255, 255, 0.45)" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="41" y="21.5" width="8" height="6.5" rx="1.8" fill="rgba(255, 255, 255, 0.45)" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="39" y1="24.5" x2="41" y2="24.5" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Friendly Eyes -->
    <circle cx="35" cy="24.8" r="1.2" fill="#0f172a"/>
    <circle cx="45" cy="24.8" r="1.2" fill="#0f172a"/>
    <circle cx="35.4" cy="24.4" r="0.4" fill="#ffffff"/>
    <circle cx="45.4" cy="24.4" r="0.4" fill="#ffffff"/>
  </g>

  <!-- Left Arm (Forward motion) -->
  <g id="avatar-left-arm" class="avatar-left-arm">
    <path d="M 28 50 L 22 62 L 25 64 L 30 54 Z" fill="var(--ctx-accent, #2563eb)"/>
    <circle cx="23" cy="64" r="2.8" fill="#fde68a"/>
  </g>

  <!-- Right Arm (Carrying Section Prop) -->
  <g id="avatar-right-arm" class="avatar-right-arm">
    <path d="M 52 50 L 59 62 L 56 64 L 50 54 Z" fill="var(--ctx-accent, #2563eb)"/>
    <circle cx="58" cy="64" r="2.8" fill="#fde68a"/>
  </g>

  <!-- ======================================================================
       MODULAR PROPS (Activated dynamically via CSS by [data-active-section])
       ====================================================================== -->

  <!-- 1. Profile: Gourmet Coffee Cup (Ready for Action) -->
  <g id="prop-profile" class="avatar-prop prop-profile">
    <path d="M 57 56 L 57 67 C 57 69 66 69 66 67 L 66 56 Z" fill="#ef4444"/>
    <path d="M 66 58 C 69 58 69 64 66 64" stroke="#ef4444" stroke-width="1.8" fill="none"/>
    <!-- Steam Lines -->
    <path d="M 59 52 Q 61 48 59 45" stroke="#94a3b8" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M 63 51 Q 65 47 63 44" stroke="#94a3b8" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 2. Highlights: Golden Star Trophy & KPI Chart -->
  <g id="prop-highlights" class="avatar-prop prop-highlights">
    <path d="M 56 54 L 68 54 L 66 63 C 65 66 59 66 58 63 Z" fill="#f59e0b"/>
    <line x1="62" y1="64" x2="62" y2="71" stroke="#d97706" stroke-width="2.4"/>
    <rect x="58" y="70" width="8" height="3" rx="1" fill="#b45309"/>
    <!-- Floating Gold Star -->
    <polygon points="68,44 70,48 74,48 71,51 72,55 68,52 64,55 65,51 62,48 66,48" fill="#fbbf24"/>
  </g>

  <!-- 3. Stack: Developer Laptop with Terminal Code Prompt -->
  <g id="prop-stack" class="avatar-prop prop-stack">
    <path d="M 52 56 L 70 56 L 68 69 L 50 69 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8"/>
    <path d="M 48 69 L 72 69 L 70 72 L 46 72 Z" fill="#475569"/>
    <!-- Code prompt </> inside screen -->
    <text x="54" y="65" font-size="6.5" font-family="ui-monospace, monospace" fill="#38bdf8" font-weight="bold">&lt;/&gt;</text>
  </g>

  <!-- 4. Experience: Architecture Blueprint & Leadership Compass -->
  <g id="prop-experience" class="avatar-prop prop-experience">
    <!-- Rolled Blueprint -->
    <rect x="54" y="55" width="16" height="6" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="0.8"/>
    <!-- Compass Badge -->
    <circle cx="68" cy="66" r="7.5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.4"/>
    <polygon points="68,60 70,66 68,65 66,66" fill="#ef4444"/>
    <polygon points="68,72 70,66 68,67 66,66" fill="#f8fafc"/>
    <circle cx="68" cy="66" r="1.2" fill="#38bdf8"/>
  </g>

  <!-- 5. Projects: Production Deployment Rocket -->
  <g id="prop-projects" class="avatar-prop prop-projects">
    <!-- Rocket Fuselage -->
    <path d="M 58 65 C 58 49 65 42 65 42 C 65 42 72 49 72 65 Z" fill="#ec4899"/>
    <!-- Window Porthole -->
    <circle cx="65" cy="53" r="2.8" fill="#ffffff" stroke="#be185d" stroke-width="0.8"/>
    <circle cx="65" cy="53" r="1.4" fill="#38bdf8"/>
    <!-- Fins -->
    <path d="M 56 64 L 52 70 L 58 68 Z" fill="#be185d"/>
    <path d="M 74 64 L 78 70 L 72 68 Z" fill="#be185d"/>
    <!-- Thruster Fire -->
    <polygon points="62,65 65,73 68,65" fill="#f97316"/>
  </g>

  <!-- 6. Education: Graduation Cap & Academic Scroll -->
  <g id="prop-education" class="avatar-prop prop-education">
    <!-- Graduation Cap on Head -->
    <polygon points="40,2 24,9 40,16 56,9" fill="#1e1b4b"/>
    <path d="M 28 12 L 28 19 C 28 23 52 23 52 19 L 52 12" fill="#312e81"/>
    <!-- Gold Tassel -->
    <line x1="40" y1="9" x2="22" y2="17" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="22" cy="17" r="1.5" fill="#fbbf24"/>
  </g>

  <!-- 7. Languages: Global Sphere with Bilingual Badges (EN / ES) -->
  <g id="prop-languages" class="avatar-prop prop-languages">
    <!-- Globe -->
    <circle cx="63" cy="61" r="9" fill="#10b981" stroke="#059669" stroke-width="1.2"/>
    <path d="M 55 61 C 59 56 67 56 71 61" fill="none" stroke="#ffffff" stroke-width="0.9"/>
    <path d="M 58 54 C 61 60 61 66 58 68" fill="none" stroke="#ffffff" stroke-width="0.9"/>
    <path d="M 68 54 C 65 60 65 66 68 68" fill="none" stroke="#ffffff" stroke-width="0.9"/>
    <!-- Bilingual Badges -->
    <rect x="52" y="44" width="10" height="6.5" rx="1.5" fill="#2563eb"/>
    <text x="54" y="49.2" font-size="4.2" font-family="system-ui, sans-serif" fill="#ffffff" font-weight="bold">EN</text>
    <rect x="64" y="44" width="10" height="6.5" rx="1.5" fill="#dc2626"/>
    <text x="66" y="49.2" font-size="4.2" font-family="system-ui, sans-serif" fill="#ffffff" font-weight="bold">ES</text>
  </g>

  <!-- 8. Complete: Celebratory Golden Star, Integrated Vector Cartel & Confetti Burst -->
  <g id="prop-complete" class="avatar-prop prop-complete">
    <!-- Golden Star above head -->
    <polygon points="40,2 42.5,7.5 48.5,8 44,12 45.5,18 40,15 34.5,18 36,12 31.5,8 37.5,7.5" fill="#eab308"/>
    <!-- Confetti Dots around star and Daniel -->
    <circle cx="16" cy="36" r="2" fill="#ec4899"/>
    <circle cx="68" cy="30" r="2.4" fill="#3b82f6"/>
    <circle cx="76" cy="46" r="2" fill="#10b981"/>
    <circle cx="12" cy="52" r="2.2" fill="#f59e0b"/>

    <!-- Integrated Cartel (Sign) Vector Artwork -->
    <!-- 1. Angled Wooden Pole connecting Daniel's left hand (23, 64) to placard bracket (-16, 40) -->
    <line x1="23" y1="64" x2="-16" y2="40" stroke="#78350f" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="22.5" y1="63.2" x2="-15.5" y2="39.2" stroke="#b45309" stroke-width="2.2" stroke-linecap="round"/>

    <!-- 2. Daniel's hand gripping the wooden pole -->
    <circle cx="23" cy="64" r="3.2" fill="#fde68a" stroke="#d97706" stroke-width="0.7"/>
    <path d="M 21.5 62 Q 23.5 61.5 25.2 62 M 21.5 64 Q 23.5 63.5 25.2 64 M 21.5 66 Q 23.5 65.5 25.2 66" stroke="#b45309" stroke-width="0.7" fill="none" stroke-linecap="round"/>

    <!-- 3. Heavy-duty mounting bracket on placard rear/bottom -->
    <rect x="-24" y="36" width="10" height="8" rx="2" fill="#5c330a"/>

    <!-- 4. Placard Board (Cartel) -->
    <!-- Placard soft drop shadow -->
    <rect x="-178" y="12" width="164" height="46" rx="6" fill="rgba(15, 23, 42, 0.22)"/>
    <!-- Outer wooden frame -->
    <rect x="-180" y="10" width="164" height="46" rx="6" fill="#854d0e" stroke="#5c330a" stroke-width="2" class="cartel-frame"/>
    <!-- Inner placard sheet surface -->
    <rect x="-176" y="14" width="156" height="38" rx="4" fill="var(--ctx-surface, #ffffff)" stroke="#b45309" stroke-width="1" class="cartel-sheet"/>

    <!-- Corner rivets on the placard -->
    <circle cx="-171" cy="19" r="1.5" fill="#5c330a"/>
    <circle cx="-171" cy="47" r="1.5" fill="#5c330a"/>
    <circle cx="-25" cy="19" r="1.5" fill="#5c330a"/>
    <circle cx="-25" cy="47" r="1.5" fill="#5c330a"/>
  </g>
</svg>
